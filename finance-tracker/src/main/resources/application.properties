spring.application.name=finance-tracker

# --- PostgreSQL connection ---
# Update these to match your local database
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=postgres
spring.datasource.password=Sherif123*
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables from entities - good for local dev.
# Switch to 'validate' once your schema is stable, and manage schema changes yourself.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Only run data.sql seed script once, and only if tables are empty-friendly
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


server.port=8081
