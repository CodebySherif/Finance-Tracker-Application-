spring.application.name=finance-tracker

# --- PostgreSQL connection ---
# Reads from environment variables if present (e.g. Railway's Postgres plugin
# auto-injects PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE), otherwise falls
# back to a local Postgres instance for `mvn spring-boot:run` on your machine.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:finance_tracker}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates tables from entities - good for local dev.
# Switch to 'validate' once your schema is stable, and manage schema changes yourself.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Railway (and most hosts) inject PORT at runtime; 8080 is the local default.
server.port=${PORT:8080}

# --- JWT auth ---
# app.jwt.secret must be a Base64-encoded string that decodes to >= 256 bits.
# Set JWT_SECRET as an environment variable in any real deployment - the value
# below is only a dev-only fallback so the app still runs locally out of the box.
# Generate your own with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:IU9jPeg90ryWx2qCyhyo4iiPHh7zs4Alg/TCE8vUouM=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Google Sign-In (optional) ---
# Leave UNSET to disable. Enable by setting these two as ENVIRONMENT VARIABLES
# (do not add blank placeholders here - a blank value still counts as "set"):
#   APP_OAUTH2_GOOGLE_CLIENT_ID=...apps.googleusercontent.com
#   APP_OAUTH2_GOOGLE_CLIENT_SECRET=...
