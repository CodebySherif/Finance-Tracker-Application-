services:

  db:
    image: postgres:16-alpine
    container_name: ledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-finance_tracker}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-finance_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ledger-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-finance_tracker}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-IU9jPeg90ryWx2qCyhyo4iiPHh7zs4Alg/TCE8vUouM=}
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  ledger-db-data:
